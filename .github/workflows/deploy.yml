name: Deploy Face Swap Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # Fix: Convert the uppercase GitHub repository name to lowercase for GHCR
      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/face_swap_pipeline
            cd ~/face_swap_pipeline
            
            # Ensure we use the lowercase name on the server as well
            IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Fetch the raw docker-compose.yml from your repository
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github.v3.raw" \
                 -L https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.yml \
                 -o docker-compose.yml
            
            # Replace the local 'build: .' directive with the lowercase built image from GHCR
            sed -i "s|build: .|image: ghcr.io/${IMAGE_NAME}:latest|g" docker-compose.yml
            
            # Pull the latest image and restart the container
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Clean up old unused images to save disk space
            docker image prune -f