name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone if repo doesn't exist yet on server, otherwise pull
            if [ ! -d "face_swap_pipeline" ]; then
              git clone https://github.com/${{ github.repository }}.git face_swap_pipeline
            fi
            
            cd face_swap_pipeline
            
            # Discard any local changes and pull the latest from main
            git reset --hard
            git pull origin main
            
            # Clean up old Docker files to free up space
            sudo docker system prune -af
            
            # Build Docker Image locally on the EC2 instance
            sudo docker build -t face-pipeline .
            
            # Stop old container if running
            sudo docker stop face-pipeline-container || true
            sudo docker rm face-pipeline-container || true
            
            # Run new container
            sudo docker run -d --name face-pipeline-container -p 8000:8001 --restart unless-stopped face-pipeline