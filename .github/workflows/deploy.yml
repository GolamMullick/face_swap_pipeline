name: Deploy to EC2 with Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Check if a valid git repo exists. If not, wipe the folder and clone fresh.
            if [ ! -d "face_swap_pipeline/.git" ]; then
              echo "Git repository not found. Cleaning up and cloning fresh..."
              sudo rm -rf face_swap_pipeline
              git clone https://github.com/${{ github.repository }}.git face_swap_pipeline
            fi
            
            cd face_swap_pipeline
            
            # 2. Force the local folder to match the GitHub main branch exactly
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Clean up old Docker files to free up space
            sudo docker system prune -af
            
            # 4. Build Docker Image locally on the EC2 instance
            sudo docker build -t face-pipeline .
            
            # 5. Stop old container if running
            sudo docker stop face-pipeline-container || true
            sudo docker rm face-pipeline-container || true
            
            # 6. Run new container on port 8001
            sudo docker run -d --name face-pipeline-container -p 8001:8001 --restart unless-stopped face-pipeline